{% from "_icons.html" import icon %}
<div class="step">
  <div class="narration">{{ icon("info") }}<span><strong>Step {{ step.index }}.</strong> {{ step.narrate }}</span></div>
  {% for note in step.notes %}<div class="notes">{{ note }}</div>{% endfor %}
  {% if step.said %}
  <div class="msg user"><div class="bubble"><p>{{ step.said }}</p></div></div>
  {% include "_agent.html" %}
  {% endif %}
</div>
