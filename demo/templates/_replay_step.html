<div class="replay-step">
  <p class="narration"><strong>Step {{ step.index }}.</strong> {{ step.narrate }}</p>
  {% for note in step.notes %}<p class="muted"><small>• {{ note }}</small></p>{% endfor %}
  {% if step.said %}
  <div class="bubble customer"><p>{{ step.said }}</p></div>
  {% include "_agent.html" %}
  {% endif %}
</div>
