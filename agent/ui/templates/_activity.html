{% for item in activity %}<li class="list-item {{ 'warn' if item.type in ('gate_refused', 'reply_blocked', 'injection_flag', 'authz_denied', 'summary_rejected') else '' }}"><span class="caption time">{{ item.time }}</span><span class="body2">{{ item.text }}</span></li>{% else %}<li class="list-item"><span class="body2 secondary">Nothing yet</span></li>{% endfor %}
