{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h1>One-time code</h1>
  {% if code %}<p class="muted">Mock code for {{ user.display_name }}: <code class="otp">{{ code }}</code></p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login/verify" class="stack">
    <input type="hidden" name="user_id" value="{{ user.id }}">
    <input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" value="{{ code or '' }}" required>
    <button class="primary">Continue</button>
  </form>
</section>
{% endblock %}
