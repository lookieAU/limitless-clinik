{% from "_icons.html" import icon %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clinik by Limitless{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="appbar">
    <div class="toolbar">
      <a class="brand" href="/">{{ icon("hospital", 26) }}<span class="brand-name">Clinik</span><span class="brand-by">by Limitless</span></a>
      <div class="grow"></div>
      {% block appbar %}{% endblock %}
    </div>
  </header>
  <main class="container">{% block body %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
  <script src="/static/app.js" defer></script>
</body>
</html>
