{% extends "base.html" %}
{% block body %}
<section class="card narrow">
  <h1>Who's booking?</h1>
  <form method="post" action="/login/start" class="stack">
    {% for user in users %}
    <button class="choice" name="user_id" value="{{ user.id }}">
      <strong>{{ user.display_name }}</strong>
      <span class="muted">{{ "Hindi" if user.preferred_lang == "hi" else "English" }} · {{ user.tz }}</span>
    </button>
    {% endfor %}
  </form>
</section>
{% endblock %}
