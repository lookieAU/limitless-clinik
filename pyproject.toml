[project]
name = "clinik"
version = "0.1.0"
description = "Clinik by Limitless — a booking agent that knows what is true"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: runs against the real LLM provider"]
addopts = "-m 'not live'"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
